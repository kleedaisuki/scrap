version: 2
updates:
  # 每周更新已固定 SHA 的 GitHub Actions。Update SHA-pinned GitHub Actions weekly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # 站点依赖独立成组，保持 Astro/pnpm 更新可审查。Group site dependency updates for reviewability.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      release-site:
        patterns: ["*"]
