name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一引用只保留最新运行，避免浪费 runner。Keep only the newest run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-site:
    name: Release site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate checked-in release versions
        shell: pwsh
        run: ./build/validate-release-version.ps1

      - name: Check site
        run: pnpm --dir website check

      - name: Test site
        run: pnpm --dir website test

      - name: Build site
        run: pnpm --dir website build

  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # 固定完整提交以降低供应链漂移；升级通过显式审查的变更完成。
      # Pin full commits to avoid dependency drift; upgrades are explicit reviewed changes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Record SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore Scrap.slnx --locked-mode

      - name: Build
        run: dotnet build Scrap.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Scrap.slnx --configuration Release --no-build --verbosity normal

      - name: Parse release scripts with PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem build -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell 7 syntax validation failed." }

      - name: Parse release scripts with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem build -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              $failed = $true
            }
          }
          if ($failed) { throw "Windows PowerShell 5.1 syntax validation failed." }

      - name: Build and inspect Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "msi-ci-payload"
          $output = Join-Path $env:RUNNER_TEMP "msi-ci-output"
          New-Item -ItemType Directory -Path $payload, $output -Force | Out-Null
          foreach ($program in @("scrap.exe", "scrapd.exe", "scrap-gui.exe")) {
            [IO.File]::WriteAllBytes((Join-Path $payload $program), [byte[]]@(0))
          }
          dotnet build installer/Scrap.Installer.Windows/Scrap.Installer.Windows.wixproj `
            --configuration Release `
            --output $output `
            -p:ProductVersion=0.0.0 `
            -p:ReleaseVersion=0.0.0-ci `
            -p:RuntimeIdentifier=win-x64 `
            -p:PayloadDir=$payload
          if ($LASTEXITCODE -ne 0) { throw "WiX installer build failed." }

          $msi = Join-Path $output "scrap-v0.0.0-ci-win-x64.msi"
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw "WiX build did not produce the expected MSI." }
          $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
          $database = $windowsInstaller.OpenDatabase($msi, 0)
          if ($null -eq $database) { throw "Windows Installer could not open the CI MSI." }

          # 同时检查两个用户入口的 MSI 表契约；真实安装/卸载仍由 release workflow 覆盖。
          # Inspect both user-entry contracts in MSI tables; the release workflow still covers real install/uninstall.
          $view = $database.OpenView('SELECT `Shortcut`, `Directory_`, `Target` FROM `Shortcut`')
          $view.Execute()
          $shortcuts = @{}
          while ($record = $view.Fetch()) {
            $shortcuts[$record.StringData(1)] = @($record.StringData(2), $record.StringData(3))
          }
          $view.Close()
          foreach ($expected in @(
            @{ Id = "ScrapGuiShortcut"; Directory = "ApplicationProgramsFolder" },
            @{ Id = "ScrapDesktopShortcut"; Directory = "DesktopFolder" }
          )) {
            if (-not $shortcuts.ContainsKey($expected.Id)) { throw "MSI is missing shortcut $($expected.Id)." }
            if ($shortcuts[$expected.Id][0] -cne $expected.Directory -or $shortcuts[$expected.Id][1] -cne "[INSTALLFOLDER]scrap-gui.exe") {
              throw "MSI shortcut $($expected.Id) has an unexpected directory or target."
            }
          }

      - name: Parse POSIX release scripts
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n build/install.sh build/uninstall.sh

      - name: Validate release legal inventory
        shell: pwsh
        run: |
          $notice = Get-Item THIRD-PARTY-NOTICES.txt
          if ($notice.Length -lt 100000) { throw "Third-party notice inventory is unexpectedly incomplete." }
          $noticeText = Get-Content $notice.FullName -Raw
          foreach ($component in @("Avalonia", "SkiaSharp", "HarfBuzz", "Inter font", "SQLitePCLRaw", ".NET Runtime")) {
            if (-not $noticeText.Contains($component, [StringComparison]::Ordinal)) { throw "Missing notice for $component." }
          }
          if (-not (Select-String -LiteralPath build/package.ps1 -Pattern 'THIRD-PARTY-NOTICES.txt' -SimpleMatch -Quiet)) {
            throw "The package script does not include the notice inventory."
          }
