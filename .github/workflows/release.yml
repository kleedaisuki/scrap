name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate version and derive release channel
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $state = ./build/validate-release-version.ps1 -Tag $tag -PassThru
          "version=$($state.Version)" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($state.IsPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Scrap.slnx --locked-mode
      - name: Build
        run: dotnet build Scrap.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Scrap.slnx --configuration Release --no-build --verbosity normal

  package:
    name: Package / ${{ matrix.rid }}
    needs: [metadata, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            extension: zip
          - os: ubuntu-latest
            rid: linux-x64
            extension: tar.gz
          - os: macos-15-intel
            rid: osx-x64
            extension: tar.gz
          - os: macos-latest
            rid: osx-arm64
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record SDK information
        run: dotnet --info
      - name: Restore locked runtime assets
        run: dotnet restore Scrap.slnx --locked-mode
      - name: Configure optional Authenticode signing
        if: runner.os == 'Windows'
        id: signing
        shell: pwsh
        env:
          # Both secrets must be configured or the release remains explicitly unsigned.
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Authenticode signing is partially configured. Set both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD secrets, or neither."
          }
          if (-not $hasCertificate) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Authenticode secrets are absent; Windows artifacts will be published unsigned and may trigger SmartScreen."
            exit 0
          }

          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          }
          catch {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not valid Base64."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "scrap-release-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
            Where-Object FullName -Like "*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "The Windows runner does not provide an x64 signtool.exe." }

          "SCRAP_SIGNTOOL_PATH=$($signTool.FullName)" >> $env:GITHUB_ENV
          "SCRAP_SIGN_PFX_PATH=$certificatePath" >> $env:GITHUB_ENV
          "enabled=true" >> $env:GITHUB_OUTPUT
      - name: Build self-contained package
        shell: pwsh
        env:
          SCRAP_SIGN_PFX_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD || '' }}
        run: ./build/package.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -Version "${{ needs.metadata.outputs.version }}" -OutputDirectory artifacts
      - name: Remove signing certificate
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SCRAP_SIGN_PFX_PATH)) {
            Remove-Item -LiteralPath $env:SCRAP_SIGN_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-test CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          if ("${{ matrix.extension }}" -eq "zip") {
            Expand-Archive "artifacts/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.zip" smoke
          } else {
            tar -C smoke -xzf "artifacts/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.tar.gz"
          }
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          $packageRoot = "smoke/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}"
          $root = "$packageRoot/payload"
          foreach ($program in @("scrap", "scrapd", "scrap-gui")) {
            if (-not (Test-Path "$root/$program$suffix" -PathType Leaf)) { throw "Missing $program$suffix" }
          }
          foreach ($notice in @("LICENSE", "THIRD-PARTY-NOTICES.txt")) {
            if (-not (Test-Path "$packageRoot/$notice" -PathType Leaf)) { throw "Missing $notice" }
          }
          & "$root/scrap$suffix" --help
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed." }
      - name: Smoke-test Linux degraded Secret Service lifecycle
        if: matrix.rid == 'linux-x64'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $payload = "$PWD/smoke/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}/payload"
          $cli = Join-Path $payload "scrap"
          $daemonPath = Join-Path $payload "scrapd"
          $profileRoot = Join-Path $env:RUNNER_TEMP "secret-service-smoke-$([Guid]::NewGuid().ToString('N'))"
          $isolatedHome = Join-Path $profileRoot "home"
          $runtimeDirectory = Join-Path $profileRoot "runtime"
          $scopeStdout = Join-Path $profileRoot "scope.stdout"
          $scopeStderr = Join-Path $profileRoot "scope.stderr"
          $daemonStdout = Join-Path $profileRoot "daemon.stdout"
          $daemonStderr = Join-Path $profileRoot "daemon.stderr"
          $originalHome = $env:HOME
          $originalRuntimeDirectory = $env:XDG_RUNTIME_DIR
          $originalBusAddress = $env:DBUS_SESSION_BUS_ADDRESS
          $daemon = $null
          $environmentIsolated = $false

          try {
            New-Item -ItemType Directory -Path $isolatedHome, $runtimeDirectory -Force | Out-Null
            & chmod 700 $isolatedHome $runtimeDirectory
            if ($LASTEXITCODE -ne 0) { throw "Could not secure the isolated Linux smoke directories." }
            $env:HOME = $isolatedHome
            $env:XDG_RUNTIME_DIR = $runtimeDirectory
            # 指定一个确定不存在的 socket，避免 runner 的桌面会话掩盖 Secret Service 降级路径。
            # Name a guaranteed-absent socket so a runner desktop session cannot mask the degraded Secret Service path.
            $env:DBUS_SESSION_BUS_ADDRESS = "unix:path=$(Join-Path $runtimeDirectory 'unreachable-session-bus')"
            $environmentIsolated = $true

            $daemon = Start-Process -FilePath $daemonPath -WorkingDirectory $payload -PassThru `
              -RedirectStandardOutput $daemonStdout -RedirectStandardError $daemonStderr

            & $cli daemon version
            if ($LASTEXITCODE -ne 0) { throw "daemon version must remain available without Secret Service." }
            if ($daemon.HasExited) { throw "The explicitly started degraded daemon exited before serving version." }
            & $cli daemon ping
            if ($LASTEXITCODE -ne 0) { throw "daemon ping must remain available without Secret Service." }

            & $cli scope list --json 1> $scopeStdout 2> $scopeStderr
            $scopeExitCode = $LASTEXITCODE
            $standardOutput = Get-Content -LiteralPath $scopeStdout -Raw
            $safeError = Get-Content -LiteralPath $scopeStderr -Raw
            if ($null -eq $standardOutput) { $standardOutput = "" } else { $standardOutput = $standardOutput.Trim() }
            if ($null -eq $safeError) { $safeError = "" } else { $safeError = $safeError.Trim() }
            if ($scopeExitCode -ne 6) { throw "scope list returned $scopeExitCode instead of the stable store exit code 6." }
            if (-not [string]::IsNullOrWhiteSpace($standardOutput)) { throw "Failed scope list unexpectedly wrote JSON output." }
            if ($safeError -ne "scrap: The OS-protected master key is unavailable.") {
              throw "scope list did not emit the stable sanitized key-provider error."
            }

            & $cli daemon shutdown --if-running
            if ($LASTEXITCODE -ne 0) { throw "daemon shutdown --if-running failed in degraded mode." }
            if (-not $daemon.WaitForExit(5000)) { throw "Degraded daemon did not exit after shutdown." }
          }
          finally {
            # 无论断言是否失败，都先走公开 shutdown 契约，再强制回收本步骤拥有的进程与 profile。
            # Regardless of assertion failures, try the public shutdown contract before reclaiming this step's process and profile.
            if ($environmentIsolated) { & $cli daemon shutdown --if-running *> $null }
            if ($null -ne $daemon -and -not $daemon.HasExited) {
              Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
              $daemon.WaitForExit(5000) | Out-Null
            }
            if ($null -ne $daemon) { $daemon.Dispose() }
            $env:HOME = $originalHome
            $env:XDG_RUNTIME_DIR = $originalRuntimeDirectory
            $env:DBUS_SESSION_BUS_ADDRESS = $originalBusAddress
            if (Test-Path -LiteralPath $profileRoot) {
              Remove-Item -LiteralPath $profileRoot -Recurse -Force -ErrorAction Stop
            }
          }
      - name: Smoke-test Windows cold-start pipe EOF
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import time

          payload = pathlib.Path.cwd() / "smoke" / "scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}" / "payload"
          cli = payload / "scrap.exe"
          # GitHub-hosted Windows runners provide an ephemeral user profile; .NET GetFolderPath ignores HOME overrides.
          scrap_root = pathlib.Path.home() / ".scrap"
          if scrap_root.exists():
              raise SystemExit("Windows hosted-runner profile was not clean before cold-start smoke")
          environment = os.environ.copy()
          try:
              ping = subprocess.run(
                  [str(cli), "daemon", "ping"],
                  capture_output=True,
                  timeout=5,
                  env=environment,
                  check=False,
              )
              if ping.returncode != 0:
                  sys.stderr.buffer.write(ping.stderr)
                  raise SystemExit("cold-start ping failed")
          finally:
              subprocess.run(
                  [str(cli), "daemon", "shutdown", "--if-running"],
                  capture_output=True,
                  timeout=5,
                  env=environment,
                  check=False,
              )
              for _ in range(10):
                  if not scrap_root.exists():
                      break
                  try:
                      shutil.rmtree(scrap_root, ignore_errors=False)
                      break
                  except PermissionError:
                      time.sleep(0.2)
              if scrap_root.exists():
                  raise SystemExit("cold-start smoke could not clean its ephemeral profile")
          print("WINDOWS_COLD_START_EOF_OK")
          '@ | python -
      - name: Smoke-test daemon lifecycle
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          $payload = "$PWD/smoke/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}/payload"
          if (-not $IsWindows) {
            $isolatedHome = Join-Path $env:RUNNER_TEMP "daemon-smoke-home"
            New-Item -ItemType Directory -Path $isolatedHome -Force | Out-Null
            $env:HOME = $isolatedHome
          }
          & "$payload/scrap$suffix" daemon version
          if ($LASTEXITCODE -ne 0) { throw "daemon version smoke test failed." }
          & "$payload/scrap$suffix" daemon ping
          if ($LASTEXITCODE -ne 0) { throw "daemon ping smoke test failed." }
          if ($IsWindows) {
            & "$payload/scrap$suffix" scope create release-smoke
            if ($LASTEXITCODE -ne 0) { throw "scope create smoke test failed." }
            "release-value" | & "$payload/scrap$suffix" set release-smoke token
            if ($LASTEXITCODE -ne 0) { throw "record set smoke test failed." }
            $value = & "$payload/scrap$suffix" get release-smoke token
            if ($LASTEXITCODE -ne 0 -or $value -ne "release-value") { throw "record get smoke test failed." }
            & "$payload/scrap$suffix" delete release-smoke token
            if ($LASTEXITCODE -ne 0) { throw "record delete smoke test failed." }
          }
          & "$payload/scrap$suffix" daemon shutdown
          if ($LASTEXITCODE -ne 0) { throw "daemon shutdown smoke test failed." }
      - name: Verify Windows installer artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = "artifacts/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.msi"
          $checksum = "$msi.sha256"
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw "Missing Windows MSI installer: $msi" }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw "Missing Windows MSI checksum: $checksum" }
          $declaredHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          if ($declaredHash -ne $actualHash) { throw "Windows MSI checksum verification failed." }

          $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
          $database = $windowsInstaller.OpenDatabase((Resolve-Path $msi).Path, 0)
          if ($null -eq $database) { throw "Windows Installer could not open the generated MSI." }
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            & $env:SCRAP_SIGNTOOL_PATH verify /pa /all $msi
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for the signed MSI." }
          }
          else {
            Write-Host "::notice::Verified MSI structure and checksum; Authenticode verification was skipped because signing is not configured."
          }
      - name: Smoke-test Windows MSI install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "artifacts/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.msi").Path
          $logDirectory = Join-Path $PWD "artifacts/installer-smoke"
          $installLog = Join-Path $logDirectory "install.log"
          $uninstallLog = Join-Path $logDirectory "uninstall.log"
          $installDirectory = Join-Path $env:LOCALAPPDATA "Scrap"
          $startMenuShortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Scrap\Scrap.lnk"
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "Scrap.lnk"
          $dataDirectory = Join-Path ([Environment]::GetFolderPath("UserProfile")) ".scrap"
          $sentinel = Join-Path $dataDirectory "msi-data-must-survive"
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($null -eq $originalUserPath) { $originalUserPath = "" }
          New-Item -ItemType Directory -Path $logDirectory, $dataDirectory -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value "keep"

          # Wait for the GUI-subsystem Windows Installer process and capture its real exit code.
          # 等待 GUI 子系统的 Windows Installer 进程，并读取真实退出码。
          function Invoke-MsiExec {
            param([Parameter(Mandatory)][string[]] $Arguments)

            $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
              -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
            return $process.ExitCode
          }

          # Compare PATH by effective entries because Windows Installer may normalize separators.
          # 按有效路径项比较 PATH，因为 Windows Installer 可能会规范化分隔符。
          function Get-NormalizedPathEntries {
            param([AllowEmptyString()][string] $Value)

            return @($Value -split ';' |
              ForEach-Object { $_.Trim().TrimEnd('\').ToUpperInvariant() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Sort-Object -Unique)
          }

          $failure = $null
          try {
            $installExitCode = Invoke-MsiExec @("/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$installLog`"")
            if ($installExitCode -notin @(0, 3010)) { throw "MSI installation failed with exit code $installExitCode." }
            foreach ($program in @("scrap.exe", "scrapd.exe", "scrap-gui.exe")) {
              if (-not (Test-Path -LiteralPath (Join-Path $installDirectory $program) -PathType Leaf)) {
                throw "MSI did not install $program."
              }
            }
            if (-not (Test-Path -LiteralPath $startMenuShortcut -PathType Leaf)) { throw "MSI did not create the Start menu shortcut." }
            if (-not (Test-Path -LiteralPath $desktopShortcut -PathType Leaf)) { throw "MSI did not create the Desktop shortcut." }
            $installedUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
            $installedPathEntries = @($installedUserPath -split ';' | ForEach-Object { $_.TrimEnd('\') })
            if ($installDirectory.TrimEnd('\') -notin $installedPathEntries) { throw "MSI did not add its install directory to the user PATH." }
          }
          catch {
            $failure = $_
          }
          finally {
            if (Test-Path -LiteralPath $installDirectory) {
              $uninstallExitCode = Invoke-MsiExec @("/x", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$uninstallLog`"")
              if ($uninstallExitCode -notin @(0, 3010) -and $null -eq $failure) {
                $failure = "MSI uninstall failed with exit code $uninstallExitCode."
              }
            }
          }

          if (Test-Path -LiteralPath $installDirectory) { throw "MSI uninstall left the install directory behind." }
          if (Test-Path -LiteralPath $startMenuShortcut) { throw "MSI uninstall left the Start menu shortcut behind." }
          if (Test-Path -LiteralPath $desktopShortcut) { throw "MSI uninstall left the Desktop shortcut behind." }
          $restoredUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($null -eq $restoredUserPath) { $restoredUserPath = "" }
          $originalPathEntries = @(Get-NormalizedPathEntries $originalUserPath)
          $restoredPathEntries = @(Get-NormalizedPathEntries $restoredUserPath)
          if (Compare-Object -ReferenceObject $originalPathEntries -DifferenceObject $restoredPathEntries) {
            throw "MSI uninstall did not restore the effective user PATH entries."
          }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) { throw "MSI uninstall removed user data." }
          if ($null -ne $failure) { throw $failure }
      - name: Upload Windows Installer diagnostic logs
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-logs-${{ matrix.rid }}
          path: artifacts/installer-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke-test Unix installer contract
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/scrap-home"
          package="$PWD/smoke/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}"
          mkdir -p "$HOME"
          printf 'untouched\n' > "$HOME/.bashrc"
          cp "$HOME/.bashrc" "$HOME/bashrc.before"
          bashrc_inode=$(ls -di "$HOME/.bashrc" | awk '{print $1}')
          printf 'zsh target\n' > "$HOME/zsh-profile-target"
          ln -s "$HOME/zsh-profile-target" "$HOME/.zshrc"
          target_inode=$(ls -di "$HOME/zsh-profile-target" | awk '{print $1}')
          target_mode=$(ls -ld "$HOME/zsh-profile-target" | awk '{print $1}')
          SHELL=/bin/zsh "$package/install.sh"
          test ! -e "$HOME/.scrap/data"
          SHELL=/bin/zsh "$package/uninstall.sh"
          test ! -e "$HOME/.scrap/data"
          SHELL=/bin/zsh "$package/install.sh"
          test ! -e "$HOME/.scrap/data"
          mkdir -p "$HOME/.scrap/data"
          printf keep > "$HOME/.scrap/data/sentinel"
          SHELL=/bin/zsh "$package/install.sh"
          test "$(grep -c '^# >>> scrap PATH / scrap PATH begin >>>$' "$HOME/.profile")" -eq 1
          test -x "$HOME/.scrap/bin/scrap"
          SHELL=/bin/zsh "$package/uninstall.sh"
          test -L "$HOME/.zshrc"
          test "$(ls -di "$HOME/zsh-profile-target" | awk '{print $1}')" = "$target_inode"
          test "$(ls -ld "$HOME/zsh-profile-target" | awk '{print $1}')" = "$target_mode"
          cmp "$HOME/.bashrc" "$HOME/bashrc.before"
          test "$(ls -di "$HOME/.bashrc" | awk '{print $1}')" = "$bashrc_inode"
          printf '%s\n%s\n' '# >>> scrap PATH / scrap PATH begin >>>' 'partial user content' > "$HOME/.zprofile"
          cp "$HOME/.zprofile" "$HOME/zprofile.partial"
          SHELL=/bin/zsh "$package/uninstall.sh"
          cmp "$HOME/.zprofile" "$HOME/zprofile.partial"
          cat > "$HOME/path-body" <<'EOF'
          case ":$PATH:" in
            *":$HOME/.scrap/bin:"*) ;;
            *) export PATH="$HOME/.scrap/bin:$PATH" ;;
          esac
          EOF
          for prefix_lines in 0 1 2 3 4; do
            printf '%s\n' '# >>> scrap PATH / scrap PATH begin >>>' > "$HOME/.zprofile"
            awk -v count="$prefix_lines" 'NR <= count' "$HOME/path-body" >> "$HOME/.zprofile"
            printf 'user content %s must survive\n' "$prefix_lines" >> "$HOME/.zprofile"
            SHELL=/bin/zsh "$package/install.sh"
            SHELL=/bin/zsh "$package/uninstall.sh"
            grep -q "user content $prefix_lines must survive" "$HOME/.zprofile"
            ! grep -Fq '# >>> scrap PATH / scrap PATH begin >>>' "$HOME/.zprofile"
            ! grep -Fq 'export PATH="$HOME/.scrap/bin:$PATH"' "$HOME/.zprofile"
          done
          test -f "$HOME/.scrap/data/sentinel"
          ! grep -q '^# >>> scrap PATH / scrap PATH begin >>>$' "$HOME/.profile"
          "$package/install.sh" --no-path
          "$package/uninstall.sh" --purge --yes --no-path
          test ! -e "$HOME/.scrap"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/scrap-v${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [metadata, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create aggregate checksums
        shell: bash
        run: |
          cd dist
          sha256sum --check scrap-*.sha256
          sha256sum scrap-*.zip scrap-*.tar.gz scrap-*.msi > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD != '' }}
        shell: bash
        run: |
          if [[ "${{ needs.metadata.outputs.is_prerelease }}" == "true" ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--prerelease=false)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" "${release_flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "scrap ${GITHUB_REF_NAME}" "${release_flags[@]}"
          fi

          # Publish the verified signing state beside every release instead of relying on CI logs.
          # 将已验证的签名状态写入每个 Release，而不是要求用户翻阅 CI 日志。
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > "$notes_file"
          if ! grep -q '^## Windows trust status / Windows 信任状态$' "$notes_file"; then
            if [[ "$WINDOWS_SIGNING_CONFIGURED" == "true" ]]; then
              cat >> "$notes_file" <<'EOF'

          ## Windows trust status / Windows 信任状态

          Windows executables and the MSI were Authenticode-signed, RFC 3161-timestamped, and verified by this release workflow. SmartScreen prompts can still depend on publisher reputation.

          Windows 可执行文件与 MSI 已完成 Authenticode 签名、RFC 3161 时间戳和发布工作流验证；SmartScreen 是否提示仍可能取决于发布者信誉。

          [Code signing policy](https://github.com/kleedaisuki/scrap/blob/main/docs/code-signing-policy.md)
          EOF
            else
              cat >> "$notes_file" <<'EOF'

          ## Windows trust status / Windows 信任状态

          This Windows MSI is a real per-user installer and passed automated install/uninstall validation, but it is **unsigned** because no public-trust Authenticode credential is configured. Microsoft Defender SmartScreen may show a warning. Do not disable or bypass Windows protection; verify the SHA-256 checksum, or wait for a future publicly signed/Store-distributed build.

          本 Windows MSI 是真实的当前用户安装程序，并已通过自动安装/卸载验证；但仓库尚未配置公众信任的 Authenticode 凭据，因此该版本**未签名**，Microsoft Defender SmartScreen 仍可能提示。请勿关闭或绕过 Windows 防护；可以先核对 SHA-256 校验和，或等待后续公众签名/商店分发版本。

          [Code signing policy](https://github.com/kleedaisuki/scrap/blob/main/docs/code-signing-policy.md)
          EOF
            fi
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes_file"
          fi

          installer="scrap-v${{ needs.metadata.outputs.version }}-win-x64.msi"
          mkdir released-installer
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "$installer" \
            --pattern "$installer.sha256" \
            --dir released-installer \
            --clobber
          (cd released-installer && sha256sum --check "$installer.sha256")
